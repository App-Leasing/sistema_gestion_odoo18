  <header class="bg-slate-900 text-white shadow-md border-b border-slate-800 sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 py-3 flex flex-col md:flex-row items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <div class="p-2.5 rounded-xl shadow-inner text-white transition-colors"
          :class="activeModule === 'pricelists' ? 'bg-indigo-600' : 'bg-amber-600'">
          <i :class="activeModule === 'pricelists' ? 'fa-solid fa-tags' : 'fa-solid fa-ship'" class="text-xl"></i>
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h1 class="text-lg font-bold tracking-tight"
              x-text="activeModule === 'pricelists' ? 'Odoo 18 - Gestor de Listas de Precios' : 'Odoo 18 - Costos en Destino & Saneamiento'">
            </h1>
            <span
              class="text-[10px] px-2 py-0.5 bg-indigo-500/20 text-indigo-300 rounded-full font-semibold border border-indigo-400/30">Mergal
              SA</span>
          </div>
          <p class="text-xs text-slate-400"
            x-text="activeModule === 'pricelists' ? 'Consulta masiva de inventario y actualización de tarifas vía XML-RPC' : 'Automatización de Landed Costs vía recepciones y corrección de asientos'">
          </p>
        </div>
      </div>

      <!-- Navigation Tabs Switcher -->
      <div class="flex items-center gap-1.5 bg-slate-800 p-1.5 rounded-xl border border-slate-700">
        <button type="button" @click="activeModule = 'pricelists'"
          :class="activeModule === 'pricelists' ? 'bg-indigo-600 text-white shadow-sm font-bold' : 'text-slate-400 hover:text-slate-200 font-medium'"
          class="flex items-center gap-2 px-3.5 py-1.5 rounded-lg text-xs transition-all">
          <i class="fa-solid fa-tags"></i>
          <span>Listas de Precios</span>
        </button>
        <button type="button" @click="activeModule = 'landed_costs'; onSwitchToLandedCosts()"
          :class="activeModule === 'landed_costs' ? 'bg-amber-600 text-white shadow-sm font-bold' : 'text-slate-400 hover:text-slate-200 font-medium'"
          class="flex items-center gap-2 px-3.5 py-1.5 rounded-lg text-xs transition-all">
          <i class="fa-solid fa-ship"></i>
          <span>Costos en Destino</span>
          <span
            class="bg-amber-500/30 text-amber-200 text-[10px] px-1.5 py-0.5 rounded font-mono font-bold">Nuevo</span>
        </button>
      </div>

      <!-- Conexión Status -->
      <div class="flex items-center gap-2 text-xs">
        <div
          class="flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-slate-800 border border-slate-700 text-emerald-400">
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
          <span class="font-mono text-[11px]" x-text="status.database || 'Conectando a Odoo...'"></span>
        </div>
        <div class="px-2.5 py-1.5 rounded-full bg-slate-800 text-slate-300 text-[11px] hidden sm:block">
          UID: <span class="font-bold text-amber-400" x-text="status.uid || '---'"></span>
        </div>
      </div>
    </div>
  </header>
